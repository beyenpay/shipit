name: release

# Push a tag like v1.2.3 to publish shipit-linux-{amd64,arm64} + checksums.txt,
# and move the floating major tag (v1) that `uses: beyenpay/shipit@v1` points at.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/shipit-linux-$arch" .
          done
          (cd dist && sha256sum shipit-linux-* > checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
