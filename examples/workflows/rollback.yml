# .github/workflows/rollback.yml - roll a project back from the Actions tab
# ("Run workflow"), without logging in to the server.
#
# Leave `tag` empty to return to the previous version, or enter any tag that is
# still on the server (see `shipit list <project>`).
name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to roll back to (empty = previous)
        required: false
        default: ""

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: beyenpay/shipit@v1
        with:
          action: rollback
          tag: ${{ inputs.tag }}
          url: ${{ secrets.SHIPIT_URL }}
          secret: ${{ secrets.SHIPIT_SECRET }}
          project: beyen-home      # the only value to change
